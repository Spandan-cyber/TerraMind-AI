<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Settings | TerraMind</title>

<!-- FAVICON LINK -->
<link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo-terramind.png') }}">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/analysis.css') }}">

</head>
<body>

<div class="analysis-layout">

<aside class="sidebar">

    <div class="logo">🌱 TerraMind</div>
    <p>Precision Agriculture Platform</p>

    <hr>

    <a href="/dashboard"><i class="bi bi-house-fill"></i> Dashboard</a>
    <a href="/farms"><i class="bi bi-tree-fill"></i> My Farms</a>
    <a href="/add-farm"><i class="bi bi-plus-circle-fill"></i> Add Farm</a>
    <a href="/history"><i class="bi bi-clock-history"></i> History</a>
    <a href="/weather"><i class="bi bi-cloud-sun-fill"></i> Weather</a>
    <a href="/advisory"><i class="bi bi-lightbulb-fill"></i> AI Advisories</a>
    <a href="/profile"><i class="bi bi-person-circle"></i> Profile</a>
    <a href="/settings" class="active"><i class="bi bi-gear-fill"></i> Settings</a>

    <div class="sidebar-bottom">
        <a href="#" data-logout>
            <i class="bi bi-box-arrow-right"></i> Logout
        </a>
    </div>

</aside>

<main class="content">

    <header class="topbar">
        <div>
            <h2>Settings</h2>
            <p>Manage your account and session.</p>
        </div>
    </header>

    <div class="glass-card" style="max-width:480px;">
        <h5>Session</h5>
        <p style="color:var(--muted);margin:8px 0 18px;">
            Log out of TerraMind on this device.
        </p>
        <button class="btn btn-outline-success" data-logout>
            <i class="bi bi-box-arrow-right"></i> Logout
        </button>
    </div>

    <!--
        TODO: notification preferences, password change, and
        units (°C vs °F, ha vs acres) go here once there are
        backend endpoints to support them.
    -->

</main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/pages.js') }}"></script>

</body>
</html>
