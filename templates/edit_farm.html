<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Edit Farm | TerraMind

</title>

<!-- FAVICON LINK -->
<link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo-terramind.png') }}">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<link
rel="stylesheet"
href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css">

<link
rel="stylesheet"
href="{{ url_for('static', filename='css/farms.css') }}">

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body data-farm-id="{{ farm_id }}">

<div class="container-fluid">

<div class="row">

<!-- ========================= -->
<!-- LEFT PANEL -->
<!-- ========================= -->

<div class="col-lg-4 sidebar">

<a
href="/farms"
class="back-btn">

<i class="bi bi-arrow-left"></i>

My Farms

</a>

<h2>

✏️ Edit Farm

</h2>

<p>

Update your farm's details or redraw its boundary.

</p>

<hr>

<div class="mb-3">

<label>

Farm Name

</label>

<input
id="farmName"
class="form-control">

</div>

<div class="mb-3">

<label>

Crop

</label>

<select
id="crop"
class="form-select">

<option>Rice</option>

<option>Wheat</option>

<option>Maize</option>

<option>Cotton</option>

<option>Sugarcane</option>

<option>Vegetables</option>

<option>Other</option>

</select>

</div>

<div class="mb-3">

<label>

Village

</label>

<input
id="village"
class="form-control">

</div>

<div class="mb-3">

<label>

District

</label>

<input
id="district"
class="form-control">

</div>

<div class="mb-3">

<label>

State

</label>

<input
id="state"
class="form-control">

</div>

<div class="mb-3">

<label>

Notes

</label>

<textarea
id="notes"
rows="4"
class="form-control"></textarea>

</div>

<hr>

<h5>

📍 Search Location

</h5>

<p style="color:#777;font-size:.85rem;margin-top:-10px;">

Use this to reposition the map, or edit the existing
boundary below directly.

</p>

<div class="input-group">

<input

id="searchInput"

class="form-control"

placeholder="Village, City, Farm">

<button

id="searchBtn"

class="btn btn-success">

Search

</button>

</div>

<div class="mt-4">

<button

id="saveFarm"

class="btn btn-success w-100">

<i class="bi bi-floppy"></i>

Save Changes

</button>

</div>

<div class="mt-2">

<button

class="btn btn-outline-secondary w-100"

onclick="window.location='/farms'">

Cancel

</button>

</div>

</div>

<!-- ========================= -->
<!-- RIGHT PANEL: MAP -->
<!-- ========================= -->

<div class="col-lg-8 map-panel p-0">

    <div id="map"></div>

    <div class="map-stats-bar">

        <div class="stat-pill">
            <strong>Area</strong>
            <span id="farmArea">--</span>
        </div>

        <div class="stat-pill">
            <strong>Perimeter</strong>
            <span id="farmPerimeter">--</span>
        </div>

        <div class="stat-pill">
            <strong>Vertices</strong>
            <span id="vertices">0</span>
        </div>

        <div class="stat-pill">
            <strong>Status</strong>
            <span id="status">Loading Farm...</span>
        </div>

    </div>

</div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>

<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

<script src="{{ url_for('static', filename='js/edit_map.js') }}"></script>

</body>

</html>
