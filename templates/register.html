<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deploy Farm - TerraMind</title>
  <!-- FAVICON LINK -->
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo-terramind.png') }}">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>
<body class="relative w-full h-screen overflow-hidden bg-black font-sans text-white">

  <!-- THE DEW VIDEO BACKGROUND -->
  <video autoplay loop muted playsinline class="fixed inset-0 w-full h-full object-cover z-0">
    <source src="{{ url_for('static', filename='videos/dew.mp4') }}" type="video/mp4">
  </video>

  <!-- THE DIMMING LAYER -->
  <div class="fixed inset-0 bg-black/40 z-0"></div>

  <!-- Styled Navbar -->
  <nav class="absolute top-0 left-0 right-0 z-50 px-6 py-4 flex items-center justify-between pointer-events-auto">
    <div class="flex items-center gap-2 text-xl md:text-2xl font-bold tracking-tight text-white drop-shadow-md">
      Terra<span class="text-emerald-500">Mind</span>
    </div>
    <a href="/" class="flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white/5 border border-white/10 text-xs md:text-sm font-medium text-gray-300 hover:bg-white/10 hover:text-white transition-all backdrop-blur-md shadow-lg">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      Back to Home
    </a>
  </nav>

  <!-- COMPACT FROSTED GLASS BOX (Centered, fits 100vh with no scroll) -->
  <div class="relative z-10 w-full h-screen flex flex-col items-center justify-center px-4 pt-12 pb-4">
    
    <div id="register-card" class="w-full max-w-3xl rounded-2xl md:rounded-3xl bg-white/5 border border-white/20 backdrop-blur-2xl shadow-[0_8px_32px_rgba(0,0,0,0.5)] opacity-0 flex flex-col md:flex-row relative overflow-hidden">

      <!-- LEFT PANEL: Info, Google Sign In & Animation -->
      <div class="md:w-5/12 p-6 md:p-8 bg-black/40 border-b md:border-b-0 md:border-r border-white/10 flex flex-col justify-between">
        <div>
          <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-white mb-1 drop-shadow-sm">Deploy Farm</h1>
          <p class="text-xs text-gray-300 mb-4">Initialize satellite telemetry and AI crop advisory.</p>

          <a href="/auth/google" class="w-full flex items-center justify-center gap-2.5 px-3.5 py-2.5 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 transition-colors backdrop-blur-md text-xs md:text-sm font-medium text-white shadow-sm hover:shadow-md">
            <svg class="w-4 h-4" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Sign up with Google
          </a>
        </div>

        <!-- COMPACT ANIMATION -->
        <div class="flex items-center justify-center py-2 hidden md:flex pointer-events-none">
          <lottie-player 
            src="{{ url_for('static', filename='animations/divider.json') }}" 
            background="transparent" 
            speed="1" 
            style="width: 140px; height: 140px;" 
            loop 
            autoplay>
          </lottie-player>
        </div>

        <div class="pt-2 text-center text-xs text-gray-300">
          Already active? 
          <a href="/login" class="font-medium text-white hover:text-emerald-400 transition-colors pb-0.5 border-b border-transparent hover:border-emerald-400">Log in</a>
        </div>
      </div>

      <!-- RIGHT PANEL: Email Form -->
      <div class="md:w-7/12 p-6 md:p-8 flex flex-col justify-center">
        <form id="registerForm" action="/register" method="POST" class="space-y-3.5">
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
            <div>
              <label for="name" class="text-[11px] font-semibold tracking-wide text-gray-300 uppercase drop-shadow-sm">Full Name</label>
              <input type="text" id="name" name="name" required placeholder="John Doe" 
                class="w-full mt-1 px-3.5 py-2.5 rounded-xl bg-black/40 border border-white/10 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-colors backdrop-blur-md">
            </div>

            <div>
              <label for="email" class="text-[11px] font-semibold tracking-wide text-gray-300 uppercase drop-shadow-sm">Email Address</label>
              <input type="email" id="email" name="email" required placeholder="farmer@terramind.ai" 
                class="w-full mt-1 px-3.5 py-2.5 rounded-xl bg-black/40 border border-white/10 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-colors backdrop-blur-md">
            </div>
          </div>

          <div>
            <label for="password" class="text-[11px] font-semibold tracking-wide text-gray-300 uppercase drop-shadow-sm">Create Password</label>
            <input type="password" id="password" name="password" required placeholder="••••••••" 
              class="w-full mt-1 px-3.5 py-2.5 rounded-xl bg-black/40 border border-white/10 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-colors backdrop-blur-md">
          </div>

          <button type="submit" class="w-full pt-1">
            <div class="w-full px-6 py-2.5 rounded-xl text-sm font-bold bg-emerald-500 hover:bg-emerald-400 text-black transition-all shadow-[0_0_20px_rgba(16,185,129,0.2)] hover:shadow-[0_0_30px_rgba(16,185,129,0.4)] transform hover:-translate-y-0.5">
              Initialize Account
            </div>
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    gsap.fromTo("#register-card", 
      { opacity: 0, y: 20, scale: 0.96 }, 
      { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "power3.out", delay: 0.15 }
    );
  </script>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
