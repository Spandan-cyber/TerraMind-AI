<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Page Not Found | TerraMind AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #06090e;
            color: #f3f4f6;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .glow-emerald {
            box-shadow: 0 0 40px rgba(16, 185, 129, 0.15);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="max-w-lg w-full glass-card glow-emerald rounded-3xl p-8 text-center relative overflow-hidden">
        <!-- Background Ambient Glow -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Satellite Search Icon Badge -->
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 mb-6">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
        </div>

        <h1 class="text-3xl font-extrabold text-white tracking-tight mb-2">Page Not Found</h1>
        <p class="text-sm text-emerald-400 font-medium mb-4">HTTP 404 • Lost in Orbit</p>

        <p class="text-gray-400 text-sm leading-relaxed mb-8">
            The telemetry destination or page you were searching for could not be found or may have moved.
        </p>

        <div class="flex items-center justify-center">
            <a href="/dashboard" class="px-6 py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm transition duration-200 shadow-lg shadow-emerald-500/25">
                🌱 Return to Dashboard
            </a>
        </div>
    </div>
</body>
</html>
